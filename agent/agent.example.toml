
control_url = "http://localhost:8080"
worker_token = "REPLACE_WITH_WORKER_TOKEN"

supplier_id = "00000000-0000-0000-0000-000000000000"

paused = false
# allowed_weekdays = [1, 2, 3, 4, 5] # 0=Sunday … 6=Saturday
# allowed_workload_classes = ["embed", "batch_infer"]
allow_model_downloads = true
max_model_cache_gb = 4.0
power_only = false          # true = refuse to run on battery
# quiet_hours = [22, 6]     # local hours [start, end); wraps midnight; agent aborts in-flight work too
min_payout_usd_per_hr = 0.0 # decline work paying less than this
data_dir = "/tmp/merc-agent"  # scratch dir (job data is wiped post-commit)

memory_headroom_gb = 8.0    # GB reserved for YOUR use; lower it on a dedicated box
max_memory_pct = 85.0       # pause new work once physical memory use hits this %

# The installer creates agent.prefs.toml beside this file. Changes there are
# reloaded before every claim and during in-flight safety checks; malformed
# preferences fail closed instead of continuing with an older policy.
# max_concurrent_tasks is read at process start because it sizes the execution
# semaphore; changing that one setting requires a service restart.

checkpoint_secs = 30

# batch_infer execution backend:
#   candle       — in-process Candle/Metal (default; verified-work capable)
#   openai_http  — any OpenAI-compatible engine (llama-server, vLLM, SGLang).
#                  The ENGINE continuous-batches; this agent only fans out requests.
# openai_http is NOT guaranteed byte-deterministic under continuous batching —
# do not use it for redundancy-verified work.
inference_backend = "candle"
# openai_base_url = "http://127.0.0.1:8099/v1"   # scripts/real-engine.sh default
# openai_model    = "cx-chat-1b"
# openai_api_key  = ""
