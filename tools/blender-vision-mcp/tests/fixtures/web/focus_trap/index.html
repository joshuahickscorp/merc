<!doctype html>
<meta charset="utf-8">
<title>Focus trap fixture</title>
<h1>Focus trap fixture</h1>
<button id="trapped">Trapped control</button>
<button id="unreachable-one">Unreachable one</button>
<a id="unreachable-two" href="#end">Unreachable two</a>
<script>
  // A modal-style trap: focus is pinned to one control, so the remaining
  // focusable elements can never be reached by sequential navigation.
  const trapped = document.getElementById("trapped");
  document.addEventListener("focusin", event => {
    if (event.target !== trapped) trapped.focus();
  });
</script>
