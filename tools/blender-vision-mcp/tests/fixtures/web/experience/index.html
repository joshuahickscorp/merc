<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Owned Experience Fixture</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <button
        id="menu-trigger"
        aria-controls="site-menu"
        aria-expanded="false"
        data-source="Navigation.tsx:18"
      >
        Menu
      </button>
      <nav id="site-menu" hidden>
        <a href="#motion-stage">Motion</a>
      </nav>
      <nav id="desktop-nav" aria-label="Desktop navigation">
        <a href="#tabs">Tabs</a>
      </nav>
      <button id="mobile-nav" aria-label="Mobile navigation">Mobile</button>
    </header>

    <main>
      <button id="dialog-trigger" data-source="Dialog.tsx:11">Open dialog</button>
      <dialog id="fixture-dialog">
        <p>Observed dialog state</p>
        <button id="dialog-close">Close dialog</button>
      </dialog>

      <section id="tabs" data-component="Tabs">
        <div role="tablist" aria-label="Fixture views">
          <button id="tab-one" role="tab" aria-selected="true" aria-controls="panel-one">
            First
          </button>
          <button id="tab-two" role="tab" aria-selected="false" aria-controls="panel-two">
            Second
          </button>
        </div>
        <div id="panel-one" role="tabpanel">First panel</div>
        <div id="panel-two" role="tabpanel" hidden>Second panel</div>
      </section>

      <form id="fixture-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
        <button id="submit-form" type="submit">Validate</button>
        <p id="form-error" role="alert" hidden>Enter a valid email.</p>
      </form>

      <section id="motion-stage">
        <div id="animated-card" data-motion>Animated card</div>
      </section>
      <div id="sticky-note" data-motion>Sticky observation</div>
      <div id="parallax-card" data-motion>Parallax observation</div>
      <div class="scroll-space" aria-hidden="true"></div>
    </main>

    <script>
      const menu = document.querySelector("#site-menu");
      const menuTrigger = document.querySelector("#menu-trigger");
      menuTrigger.addEventListener("click", () => {
        const expanded = menuTrigger.getAttribute("aria-expanded") === "true";
        menuTrigger.setAttribute("aria-expanded", String(!expanded));
        menu.hidden = expanded;
      });

      const dialog = document.querySelector("#fixture-dialog");
      document.querySelector("#dialog-trigger").addEventListener("click", () => dialog.showModal());
      document.querySelector("#dialog-close").addEventListener("click", () => dialog.close());

      for (const tab of document.querySelectorAll("[role=tab]")) {
        tab.addEventListener("click", () => {
          const second = tab.id === "tab-two";
          document.querySelector("#tab-one").setAttribute("aria-selected", String(!second));
          document.querySelector("#tab-two").setAttribute("aria-selected", String(second));
          document.querySelector("#panel-one").hidden = second;
          document.querySelector("#panel-two").hidden = !second;
        });
      }

      document.querySelector("#fixture-form").addEventListener("submit", event => {
        event.preventDefault();
        const email = document.querySelector("#email");
        const invalid = !email.validity.valid;
        email.setAttribute("aria-invalid", String(invalid));
        document.querySelector("#form-error").hidden = !invalid;
      });

      addEventListener("scroll", () => {
        document.querySelector("#parallax-card").style.transform =
          `translateY(${scrollY * 0.25}px)`;
      }, {passive: true});
    </script>
  </body>
</html>
