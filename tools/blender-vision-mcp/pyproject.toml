[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "blender-vision-mcp"
version = "0.1.0"
description = "Evidence-bound reference-to-3D reconstruction workflows for Blender and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ComputExchange" }]
dependencies = [
  "mcp>=1.12,<2",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "Pillow>=10.4",
  "platformdirs>=4.2",
  "playwright>=1.54,<2",
  "pydantic>=2.8,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
vision = ["numpy>=1.26", "opencv-python-headless>=4.10"]
dev = ["jsonschema>=4.23", "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
bvmcp = "blender_vision.cli.main:main"
blender-vision = "blender_vision.mcp.server:main"

[project.urls]
Repository = "https://github.com/joshuahickscorp/blender-vision-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_vision"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/artifacts",
]

[tool.hatch.build.targets.wheel.force-include]
"blender_worker/entry.py" = "blender_vision/blender/standalone_worker.py"
"benchmarks/mac_studio/benchmark.json" = "blender_vision/benchmarks/data/mac_studio.json"
"benchmarks/calibration" = "blender_vision/benchmarks/data/calibration"
"benchmarks/dgx/benchmark.json" = "blender_vision/benchmarks/data/dgx_spark.json"
"benchmarks/rtx_5090/benchmark.json" = "blender_vision/benchmarks/data/rtx_5090_fe.json"
"schemas" = "blender_vision/schemas"
"MODEL_LICENSES.json" = "blender_vision/MODEL_LICENSES.json"
"SECURITY.md" = "blender_vision/SECURITY.md"
"docs" = "blender_vision/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
