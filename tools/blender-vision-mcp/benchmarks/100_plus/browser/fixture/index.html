<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VisionMCP Browser Matrix Fixture</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <button id="menu-trigger" aria-controls="site-menu" aria-expanded="false">Menu</button>
      <nav id="site-menu" aria-label="Primary navigation" hidden>
        <a href="#environment">Environment</a>
      </nav>
    </header>
    <main>
      <h1>Governed browser matrix</h1>
      <p id="environment" aria-live="polite">Ready</p>
      <section aria-labelledby="tabs-heading">
        <h2 id="tabs-heading">State replay</h2>
        <div role="tablist" aria-label="Fixture panels">
          <button id="tab-one" role="tab" aria-selected="true" aria-controls="panel-one">
            First
          </button>
          <button id="tab-two" role="tab" aria-selected="false" aria-controls="panel-two">
            Second
          </button>
        </div>
        <div id="panel-one" role="tabpanel" aria-labelledby="tab-one">First panel</div>
        <div id="panel-two" role="tabpanel" aria-labelledby="tab-two" hidden>Second panel</div>
      </section>
      <section aria-labelledby="network-heading">
        <h2 id="network-heading">Network state</h2>
        <button id="network-probe">Probe network</button>
        <output id="network-result" aria-live="assertive">Not checked</output>
      </section>
      <section id="motion-stage" aria-labelledby="motion-heading">
        <h2 id="motion-heading">Motion</h2>
        <div id="animated-card" data-motion>Animated card</div>
        <div id="parallax-card" data-motion>Parallax card</div>
      </section>
      <div id="sticky-note" data-motion>Sticky observation</div>
      <div class="scroll-space" aria-hidden="true"></div>
    </main>
    <script>
      const environment = document.querySelector("#environment");
      const updateEnvironment = () => {
        const state = {
          online: navigator.onLine,
          dark: matchMedia("(prefers-color-scheme: dark)").matches,
          reduced: matchMedia("(prefers-reduced-motion: reduce)").matches,
          portrait: matchMedia("(orientation: portrait)").matches,
          coarse: matchMedia("(pointer: coarse)").matches,
          dpr: devicePixelRatio,
        };
        environment.textContent = JSON.stringify(state);
      };
      updateEnvironment();
      addEventListener("online", updateEnvironment);
      addEventListener("offline", updateEnvironment);

      const menu = document.querySelector("#site-menu");
      const menuTrigger = document.querySelector("#menu-trigger");
      menuTrigger.addEventListener("click", () => {
        const expanded = menuTrigger.getAttribute("aria-expanded") === "true";
        menuTrigger.setAttribute("aria-expanded", String(!expanded));
        menu.hidden = expanded;
      });

      for (const tab of document.querySelectorAll("[role=tab]")) {
        tab.addEventListener("click", () => {
          const second = tab.id === "tab-two";
          document.querySelector("#tab-one").setAttribute("aria-selected", String(!second));
          document.querySelector("#tab-two").setAttribute("aria-selected", String(second));
          document.querySelector("#panel-one").hidden = second;
          document.querySelector("#panel-two").hidden = !second;
        });
      }

      document.querySelector("#network-probe").addEventListener("click", async () => {
        const output = document.querySelector("#network-result");
        try {
          const response = await fetch("/status.json", {cache: "no-store"});
          const payload = await response.json();
          output.textContent = payload.status;
        } catch {
          output.textContent = "Offline";
        }
      });

      addEventListener("scroll", () => {
        document.querySelector("#parallax-card").style.transform =
          `translateY(${scrollY * 0.2}px)`;
      }, {passive: true});
    </script>
  </body>
</html>
