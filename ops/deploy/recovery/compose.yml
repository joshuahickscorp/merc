# Throwaway topology for ops/scripts/recovery-suite.sh.
# Destroyed at the end of the suite. Not a production or staging stack.
# Image pins match ops/scripts/restore-drill.sh.
services:
  postgres:
    image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    environment:
      POSTGRES_USER: cx
      POSTGRES_PASSWORD: ${MERC_RECOVERY_PG_PASSWORD:-recovery-throwaway}
      POSTGRES_DB: cx
    tmpfs:
      - /var/lib/postgresql/data
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MERC_RECOVERY_MINIO_USER:-recovery}
      MINIO_ROOT_PASSWORD: ${MERC_RECOVERY_MINIO_SECRET:-recovery-throwaway-secret}
    tmpfs:
      - /data
