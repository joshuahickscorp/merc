# PostgreSQL 17 tuning for a 1 vCPU / ~961 MB production host.
# Loaded via ops/deploy/docker-compose.smallhost.yml command: postgres -c config_file=...
#
# Goal: stay correct under memory pressure (row locks, SKIP LOCKED, advisory
# locks, NUMERIC money columns). Prefer spilling to disk over OOM. Values are
# sized for the control plane pool (DB_MAX_CONNS=10) on a single CPU, not for
# analytics or multi-tenant bulk load.
#
# This file is the primary config (config_file=), so it must carry the docker
# image essentials (listen, auth, data dir paths are supplied by the image
# entrypoint via PGDATA; we only set what the postmaster reads from conf).

# --- docker / network essentials ----------------------------------------
# Official postgres image clients connect over the compose network.
listen_addresses = '*'
# Trade: binds all container interfaces (expected in compose); do not publish
# 5432 on the public host interface in the smallhost compose (we do not).
password_encryption = scram-sha-256

# --- connections ----------------------------------------------------------
# Control sets DB_MAX_CONNS=10. Superuser/admin, healthchecks, backup and a
# small spike of short-lived tools need headroom. Each backend has a base
# footprint (~5–10 MB); 40 caps that ceiling so a runaway client cannot take
# the rest of the box.
# Trade: concurrent admin/tooling sessions beyond ~30 will wait or fail with
# "too many clients" instead of silently ballooning RSS.
max_connections = 40

# --- memory ---------------------------------------------------------------
# Shared buffer cache. Default 128 MB is already a quarter of a 512 MB
# postgres cgroup; 32 MB keeps the postmaster + backends under the 192m
# mem_limit with room for per-backend work_mem.
# Trade: working sets larger than 32 MB fall through to the OS page cache
# (and, under whole-host pressure, to swap). Correctness is unchanged;
# latency under cache miss rises.
shared_buffers = 32MB

# Per-sort / hash / materialize budget. 2 MB is enough for the control plane's
# typical claim/settle plans; larger analytical sorts spill to temp files.
# Trade: complex ad-hoc queries and rare large joins use disk temp files and
# run slower, rather than each of 40 backends claiming 4–16 MB.
work_mem = 2MB

# VACUUM / CREATE INDEX / ALTER TABLE budget. 32 MB keeps maintenance inside
# the cgroup without starving the live pool.
# Trade: index builds and aggressive vacuums take longer than on a 256 MB+
# maintenance_work_mem host.
maintenance_work_mem = 32MB

# Planner hint only (not an allocation). Tells the planner roughly how much
# OS page cache the host can hold for this database. Sized to the residual
# of the 192m cgroup after shared_buffers + backends.
# Trade: underestimates if the host is otherwise idle with free RAM; the
# planner may prefer index scans slightly less often than a larger value.
effective_cache_size = 96MB

# WAL write buffer. 4 MB is the usual small-host pick; reduces fsync volume
# without a large pinned allocation.
# Trade: slightly more fsync traffic than a larger wal_buffers under bursty
# commit rates.
wal_buffers = 4MB

# --- checkpoints / WAL ----------------------------------------------------
# Spread checkpoint writes to avoid I/O stalls on a single vCPU disk.
# Trade: recovery after a hard crash may need to replay a longer WAL stretch.
checkpoint_completion_target = 0.9
# Keep WAL segments modest so a crash does not leave multi-GB of replay on a
# 24 GB disk host.
max_wal_size = 256MB
min_wal_size = 64MB

# --- planner / I/O --------------------------------------------------------
# Assume SSD-class storage (DigitalOcean droplets, typical cloud volumes).
# Trade: if the volume is spinning rust, index preference is too aggressive.
random_page_cost = 1.1
effective_io_concurrency = 50

# --- autovacuum -----------------------------------------------------------
# One worker on one CPU. The control plane's write rate on an empty order
# book is low; a single worker is enough and avoids CPU contention with the
# Go API process.
# Trade: under sustained high write load, dead-tuple cleanup lags and bloat
# grows until the worker catches up. Raise to 2 only after measuring.
autovacuum_max_workers = 1
# Check more often so the single worker sees work sooner.
# Trade: a little more background wake-up noise; still cheaper than a second
# worker contending for the only CPU.
autovacuum_naptime = 30s

# --- logging (cheap, operator-useful) -------------------------------------
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0

# --- durability -----------------------------------------------------------
# Full fsync durability — money path correctness requires this. Do not flip
# to off/local under memory pressure; that is a correctness regression.
fsync = on
synchronous_commit = on
full_page_writes = on
