# Local-dev / test-suite Postgres for `make dev-up` (docker-compose.yml)
# and the local rehearsal stack (ops/local/compose.rehearsal.yml).
#
# Not production. Not staging. Those stacks keep their own compose files
# and must not inherit this file.
#
# Why this file exists
# --------------------
# `cd src/control && go test .` (and `make test` without a schema template)
# creates many isolated databases and applies src/control/schema.sql to each.
# pgx sends that script as one simple-protocol query, so PostgreSQL runs
# it as a single implicit transaction. One apply was measured at ~1300
# rows in pg_locks (124 tables, 174 indexes, 184 constraints, 98
# functions, 106 triggers, plus toast/types). Those slots are
# cluster-wide, not per database.
#
# The image defaults (max_locks_per_transaction=64, max_connections=100)
# size the shared lock table at 64 * MaxBackends. MaxBackends is larger
# than max_connections (autovacuum workers, background workers,
# wal senders): on this image that is ~7800 slots. Five or six
# overlapping schema applies, or one apply plus ~16 isolated-test
# backends each locking a wide slice of the schema, exhausts it.
# PostgreSQL then raises SQLSTATE 53200 "out of shared memory" — the
# same error the control suite was reporting as 26 of 57 failures.
# That is a lock-table ceiling, not a product defect and not a leak.
#
# Leftover cx_iso_* databases (seen on a long-lived Homebrew cluster)
# are a separate cleanup-swallow problem. Idle leftover databases do
# not occupy lock-table slots and are not why 53200 fires.
#
# This file is loaded via `postgres -c config_file=...` so the values
# apply on every container start, including clusters that already have
# a pgdata volume (init-time ALTER SYSTEM would not).

# Official image clients connect over the compose network. Replacing
# the image-generated postgresql.conf would otherwise default to
# localhost and drop compose / published-port clients.
listen_addresses = '*'

# 512 * MaxBackends (~122 on image defaults) ≈ 62k slots, ~17 MB.
# 16 overlapping schema applies at ~1300 locks each stay under half
# of that, with room for the schema to grow. 256 would likely clear
# today's suite; 512 is the headroom so the next hundred DDL objects
# do not recreate this incident.
# Trade: ~14 MB more shared memory than the default 64. Irrelevant
# on a developer machine; do not copy this value onto the smallhost
# 192 MB cgroup.
max_locks_per_transaction = 512

# Same SQLSTATE (53200) when the predicate-lock table fills under
# SERIALIZABLE. The observed failures were object locks, not SSI.
# Cheap insurance at the same order of magnitude as the object-lock
# raise. Default 64 * MaxBackends is the same tight budget.
max_pred_locks_per_transaction = 256

# max_connections stays at the image default (100). Isolated tests
# already size their pools (5) to fit that budget; raising it would
# multiply the lock table AND the per-backend RAM footprint.
# shared_buffers stays at the image default (128 MB). The lock table
# is a separate allocation; growing the buffer cache does not add
# lock slots and is not what 53200 was asking for.
